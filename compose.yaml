# docker compose up --build  →  5개 서비스: django · celery · fastapi · redis · postgres
# 컨테이너끼리는 서비스 이름(postgres, redis, fastapi)으로 통신한다. localhost 아님!

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data   # 컨테이너를 지워도 DB 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fastapi:
    build: ./ai_service
    env_file: .env
    volumes:
      - ./ai_service/models:/app/models:ro       # 모델·가중치는 이미지에 굽지 않고 읽기 전용으로 연결
    ports:
      - "127.0.0.1:8001:8001"                    # 개발용 /docs 확인. 내 PC에서만 열림
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  django:
    build: ./backend
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - media_data:/app/media                    # 업로드 영상: django가 저장, celery가 읽음
    ports:
      - "8000:8000"
    healthcheck:                                 # /api/v1/health/ 가 DB·Redis까지 확인 (실패 시 503)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  celery:
    build: ./backend                             # Django와 같은 코드·이미지 (tasks.py 실행)
    env_file: .env
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fastapi: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
