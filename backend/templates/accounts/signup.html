{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>회원가입</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }} {{ field }}</label>
      {% for err in field.errors %}<p class="error">{{ err }}</p>{% endfor %}
    {% endfor %}
    {% for err in form.non_field_errors %}<p class="error">{{ err }}</p>{% endfor %}
    <button type="submit" class="btn primary full">가입하기</button>
  </form>
  <p class="muted">이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a></p>
</section>
{% endblock %}
